[project]
name = "pattern-tracker"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "pandas>=2.1",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[project.scripts]
pt = "pattern_tracker.pt_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
