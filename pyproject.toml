[project]
name = "pattern-tracker"
version = "0.3.0"
requires-python = ">=3.9"  # runs on macOS system python3 (3.9); no venv on any host
# Runtime is stdlib-only: hooks and the pt CLI (summary/mine/export/report) run
# on system python3 with no venv on any host. `pt judge` shells out to the
# `claude` CLI (no SDK). Report analytics use plain sqlite3 + JSONL, not pandas.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]

[project.scripts]
pt = "pattern_tracker.pt_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]
