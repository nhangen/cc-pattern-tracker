ignored_explicit_instruction:
  source_rule: no-tagging-without-approval, no-pr-comments-without-approval
  correction_phrases:
    - "stop tagging"
    - "don't @"
    - "didn't ask you to"
    - "don't post"
    - "i told you not to"
    - "without approval"

hallucinated_followup:
  source_rule: no-false-tracking-claims
  correction_phrases:
    - "tracked as"
    - "filed for follow-up"
    - "you didn't actually"
    - "where is that issue"
    - "show me the ticket"

